[package]
name = "voice-demo-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
agent-openai-compatible = { path = "../../../../ez-assistant/crates/agent-openai-compatible" }
agent-sdk = { path = "../../../../ez-assistant/crates/agent-sdk" }
agent-types = { path = "../../../../ez-assistant/crates/agent-types" }
async-trait = "0.1.89"
axum = { version = "0.8.4", features = ["ws"] }
base64 = "0.22.1"
dotenvy = "0.15.7"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.17"
tokio = { version = "1.52.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-util = "0.7.16"
